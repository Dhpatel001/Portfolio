[build]
command = "npm install --prefix server && npm install --prefix client && npm run build --prefix client"
publish = "client/dist"
functions = "server/netlify/functions"

[[redirects]]
from = "/api/contact"
to = "/.netlify/functions/contact"
status = 200
force = true

[[redirects]]
from = "/health"
to = "/.netlify/functions/health"
status = 200
force = true
